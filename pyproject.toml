[project]
name = "cybersrs-api"
version = "0.1.0"
description = "CyberSRS backend API (Phase 1A — non-AI foundation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27",
    "chromadb>=0.5,<0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "test_e2e_rag.py",
    "test_num_ctx.py",
    "test_rag_sanity.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in argument defaults is the canonical FastAPI dependency
# injection pattern; it is called once by FastAPI at route definition time.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# SQLAlchemy declarative base and FastAPI internals ship their own types.
module = ["sqlalchemy.*"]
ignore_missing_imports = true
